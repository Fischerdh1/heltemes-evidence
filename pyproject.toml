[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heltemes-evidence"
version = "0.4.0"
description = "HELTEMES Evidence — Earnings Research Platform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
heltemes = "heltemes.__main__:main"

[tool.setuptools.packages.find]
include = ["heltemes*"]

[tool.setuptools.package-data]
heltemes = ["web/*", "fixtures/*.json"]
