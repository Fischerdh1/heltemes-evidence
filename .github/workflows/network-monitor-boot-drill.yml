name: Exercise network monitor boot recovery

on:
  workflow_dispatch:
  push:
    branches: [feat/network-monitor-automatic-boot, feat/network-monitor-automatic-powercut]

permissions:
  contents: read

jobs:
  boot_recovery:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/network-monitor-automatic-boot'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install headless VM tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Verify normal, failed, and repaired guest boots
        run: |
          mkdir -p work
          python3 -I -S -B scripts/network_monitor_boot_vm.py --output work/network-monitor-boot
      - name: Retain boot recovery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-monitor-boot-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/network-monitor-boot/publish/REPORT.json
            work/network-monitor-boot/publish/VM.json
            work/network-monitor-boot/publish/BEFORE.json
            work/network-monitor-boot/publish/NORMAL.json
            work/network-monitor-boot/publish/FAILED.json
            work/network-monitor-boot/publish/RECOVERED.json
            work/network-monitor-boot/publish/MANIFEST.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain bounded failure diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-monitor-boot-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/network-monitor-boot/staging/FAILURE.json
          if-no-files-found: ignore
          retention-days: 7

  boot_powercut:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/network-monitor-automatic-powercut'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install headless VM tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Verify automatic startup after abrupt guest power loss
        run: |
          mkdir -p work
          python3 -I -S -B scripts/network_monitor_boot_powercut_vm.py --output work/network-monitor-boot-powercut
      - name: Retain power-cut recovery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-monitor-boot-powercut-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/network-monitor-boot-powercut/publish/REPORT.json
            work/network-monitor-boot-powercut/publish/VM.json
            work/network-monitor-boot-powercut/publish/BEFORE.json
            work/network-monitor-boot-powercut/publish/RECOVERED.json
            work/network-monitor-boot-powercut/publish/MANIFEST.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain bounded power-cut failure diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-monitor-boot-powercut-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/network-monitor-boot-powercut/staging/FAILURE.json
          if-no-files-found: ignore
          retention-days: 7
