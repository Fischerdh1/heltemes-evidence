name: Exercise durable network alert delivery

on:
  workflow_dispatch:
  push:
    branches: [feat/network-monitor-alert-delivery]

permissions:
  contents: read

jobs:
  alert_delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check authentication and durable retry locally
        run: python3 -B -m unittest discover -s tests -p test_network_monitor_alert_delivery.py
      - name: Install headless VM tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Exercise authenticated delivery and restart recovery
        run: |
          mkdir -p work
          python3 -I -S -B scripts/network_monitor_alert_delivery_vm.py --output work/alert-delivery
      - name: Retain bounded alert delivery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-monitor-alert-delivery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/alert-delivery/publish/REPORT.json
            work/alert-delivery/publish/DELIVERY.json
            work/alert-delivery/publish/MANIFEST.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain bounded failure diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-monitor-alert-delivery-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/alert-delivery/staging/FAILURE.json
          if-no-files-found: ignore
          retention-days: 7
