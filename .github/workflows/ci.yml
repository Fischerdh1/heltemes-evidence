name: Verify project

on:
  # Feature branches run on pull_request; main is checked again after merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline failure and integrity checks
        run: python -m unittest discover -s tests -v
      - name: Package cloud collector
        run: python scripts/package_lambda.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python scripts/package_lambda.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  network_lab:
    needs: [python]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Install tools on the disposable Linux runner
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 nftables tcpdump openssl
      - name: Exercise isolated routing and firewall policy
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p work
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SERVER_URL,REVIEWER_PR_HEAD_SHA \
            "$(command -v python3)" -I -S -B scripts/network_lab.py --output work/network-lab
      - name: Retain network lab evidence
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-lab-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/network-lab/publish/REPORT.json
            work/network-lab/publish/MANIFEST.json
            work/network-lab/publish/packet-capture.pcap
            work/network-lab/publish/packet-capture.txt
            work/network-lab/publish/policy.nft
            work/network-lab/publish/misconfigured-policy.nft
            work/network-lab/publish/SUMMARY.md
          if-no-files-found: error
          retention-days: 30
      - name: Show network lab results
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          cat work/network-lab/publish/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Download network lab evidence](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise DNS and TLS failure diagnosis
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SERVER_URL,REVIEWER_PR_HEAD_SHA \
            "$(command -v python3)" -I -S -B scripts/network_services_lab.py --output work/network-services
      - name: Retain DNS and TLS lab evidence
        id: services_evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-services-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/network-services/publish/REPORT.json
            work/network-services/publish/MANIFEST.json
            work/network-services/publish/packet-capture.pcap
            work/network-services/publish/packet-capture.txt
            work/network-services/publish/policy.nft
            work/network-services/publish/blocked-policy.nft
            work/network-services/publish/certificates.json
            work/network-services/publish/SUMMARY.md
          if-no-files-found: error
          retention-days: 30
      - name: Show DNS and TLS results
        env:
          ARTIFACT_URL: ${{ steps.services_evidence.outputs.artifact-url }}
        run: |
          cat work/network-services/publish/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Download DNS and TLS evidence](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise network segmentation and policy repair
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SERVER_URL,REVIEWER_PR_HEAD_SHA \
            "$(command -v python3)" -I -S -B scripts/network_segmentation_lab.py --output work/network-segmentation
      - name: Retain segmentation evidence
        id: segmentation_evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-segmentation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/network-segmentation/publish/REPORT.json
            work/network-segmentation/publish/MANIFEST.json
            work/network-segmentation/publish/MATRIX.json
            work/network-segmentation/publish/policy.nft
            work/network-segmentation/publish/misconfigured-policy.nft
            work/network-segmentation/publish/SUMMARY.md
            work/network-segmentation/publish/user.pcap
            work/network-segmentation/publish/user-packets.txt
            work/network-segmentation/publish/app.pcap
            work/network-segmentation/publish/app-packets.txt
            work/network-segmentation/publish/management.pcap
            work/network-segmentation/publish/management-packets.txt
          if-no-files-found: error
          retention-days: 30
      - name: Show segmentation results
        env:
          ARTIFACT_URL: ${{ steps.segmentation_evidence.outputs.artifact-url }}
        run: |
          cat work/network-segmentation/publish/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Download segmentation evidence](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise monitoring and alert recovery
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SERVER_URL,REVIEWER_PR_HEAD_SHA \
            "$(command -v python3)" -I -S -B scripts/network_monitoring_lab.py --output work/network-monitoring
      - name: Retain monitoring evidence
        id: monitoring_evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-monitoring-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/network-monitoring/publish/REPORT.json
            work/network-monitoring/publish/MANIFEST.json
            work/network-monitoring/publish/APPROVED_POLICY.json
            work/network-monitoring/publish/SNAPSHOTS.json
            work/network-monitoring/publish/EVALUATIONS.json
            work/network-monitoring/publish/ALERTS.json
            work/network-monitoring/publish/EVENTS.jsonl
            work/network-monitoring/publish/SUMMARY.md
            work/network-monitoring/publish/policy.nft
            work/network-monitoring/publish/overblocked-policy.nft
            work/network-monitoring/publish/user.pcap
            work/network-monitoring/publish/user-packets.txt
            work/network-monitoring/publish/app.pcap
            work/network-monitoring/publish/app-packets.txt
            work/network-monitoring/publish/management.pcap
            work/network-monitoring/publish/management-packets.txt
          if-no-files-found: error
          retention-days: 30
      - name: Show monitoring results
        env:
          ARTIFACT_URL: ${{ steps.monitoring_evidence.outputs.artifact-url }}
        run: |
          cat work/network-monitoring/publish/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Download monitoring evidence](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise monitor crashes and supervised restart
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SERVER_URL,REVIEWER_PR_HEAD_SHA \
            "$(command -v python3)" -I -S -B scripts/network_monitor_restart_lab.py --output work/monitor-restart
      - name: Retain monitor restart evidence
        id: monitor_restart_evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monitor-restart-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/monitor-restart/publish/REPORT.json
            work/monitor-restart/publish/MANIFEST.json
            work/monitor-restart/publish/APPROVED_POLICY.json
            work/monitor-restart/publish/OBSERVATIONS.json
            work/monitor-restart/publish/JOURNAL.json
            work/monitor-restart/publish/ALERTS.json
            work/monitor-restart/publish/EVENTS.jsonl
            work/monitor-restart/publish/SERVICE.json
            work/monitor-restart/publish/SUMMARY.md
            work/monitor-restart/publish/policy.nft
            work/monitor-restart/publish/user.pcap
            work/monitor-restart/publish/user-packets.txt
            work/monitor-restart/publish/app.pcap
            work/monitor-restart/publish/app-packets.txt
            work/monitor-restart/publish/management.pcap
            work/monitor-restart/publish/management-packets.txt
          if-no-files-found: error
          retention-days: 30
      - name: Show monitor restart results
        env:
          ARTIFACT_URL: ${{ steps.monitor_restart_evidence.outputs.artifact-url }}
        run: |
          cat work/monitor-restart/publish/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Download monitor restart evidence](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  monitor_reboot:
    needs: [python]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Refresh disposable VM package index
        run: sudo apt-get update
      # Headless local-disk guests need dependencies, not GUI/extra-backend recommendations.
      - name: Install required headless VM tools
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Exercise monitoring across a full guest reboot
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p work
          python3 -I -S -B scripts/network_monitor_reboot_vm.py --output work/monitor-reboot
