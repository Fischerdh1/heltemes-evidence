    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Refresh disposable VM package index
        run: sudo apt-get update
      # Headless local-disk guests need dependencies, not GUI/extra-backend recommendations.
      - name: Install required headless VM tools
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Trigger and verify both archive reboot collector retries
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p work
          python3 -I -S -B scripts/archive_reboot_retry_drill_vm.py --output work/archive-reboot-retry-drill
      - name: Retain verified archive reboot retry evidence
