name: Verify project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline failure and integrity checks
        run: python -m unittest discover -s tests -v
      - name: Package cloud collector
        run: python scripts/package_lambda.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python scripts/package_lambda.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  reviewer:
    needs: [python, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Build and verify disposable reviewer evidence
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p work
          python3 -I -S -B scripts/ci_reviewer.py --output work/reviewer-ci
      - name: Retain verified reviewer evidence
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/reviewer-ci/publish/reviewer.zip
            work/reviewer-ci/publish/reviewer.zip.sha256
            work/reviewer-ci/publish/CI-VERIFICATION.json
            work/reviewer-ci/publish/CI-VERIFICATION.json.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Show reviewer results
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          cat work/reviewer-ci/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Download reviewer evidence](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
