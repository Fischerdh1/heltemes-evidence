  reviewer:
    if: ${{ always() }}
    needs: [python, terraform, network_lab, monitor_reboot, monitor_powercut, monitor_automatic, monitor_archive, monitor_archive_reboot, monitor_archive_powercut, monitor_archive_retry]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every prerequisite to succeed
        env:
          PREREQUISITE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['PREREQUISITE_RESULTS'])
          expected = {
              'python', 'terraform', 'network_lab', 'monitor_reboot', 'monitor_powercut', 'monitor_automatic',
              'monitor_archive', 'monitor_archive_reboot', 'monitor_archive_powercut', 'monitor_archive_retry',
          }
          if set(results) != expected or any(value.get('result') != 'success' for value in results.values()):
              raise SystemExit('Reviewer blocked: every prerequisite, including VM reboot, abrupt virtual power loss, automatic missing-data recovery, history archiving, archived-history full reboot, archived-history abrupt power loss, and archive reboot collector retries, must succeed.')
          PY
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Build and verify disposable reviewer evidence
        env:
          REVIEWER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p work
          python3 -I -S -B scripts/ci_reviewer.py --output work/reviewer-ci
      - name: Retain verified reviewer evidence
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/reviewer-ci/publish/reviewer.zip
            work/reviewer-ci/publish/reviewer.zip.sha256
            work/reviewer-ci/publish/CI-VERIFICATION.json
            work/reviewer-ci/publish/CI-VERIFICATION.json.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Show reviewer results
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          cat work/reviewer-ci/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Download reviewer evidence](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
