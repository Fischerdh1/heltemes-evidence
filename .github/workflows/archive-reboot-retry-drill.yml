name: Archive reboot retry drill

on:
  push:
    branches: [drill/archive-reboot-retries-20261112]

permissions:
  contents: read

jobs:
  disposable_retry_drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install headless VM tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Trigger and verify both retries inside the Linux guest
        run: |
          mkdir -p work
          python3 -I -S -B scripts/archive_reboot_retry_drill_vm.py --output work/archive-reboot-retry-drill
      - name: Retain verified drill evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-reboot-retry-drill-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/archive-reboot-retry-drill/publish/REPORT.json
            work/archive-reboot-retry-drill/publish/DRILL.json
            work/archive-reboot-retry-drill/publish/VM.json
            work/archive-reboot-retry-drill/publish/MANIFEST.json
          if-no-files-found: error
          retention-days: 30
