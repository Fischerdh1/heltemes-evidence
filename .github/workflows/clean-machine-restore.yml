name: Clean-machine restore drill

on:
  push:
    branches: [lab/clean-machine-restore-20261113]

permissions:
  contents: read

jobs:
  disposable_restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install headless VM tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Restore synthetic evidence on a fresh guest
        run: |
          mkdir -p work
          python3 -I -S -B scripts/clean_restore_vm.py --output work/clean-machine-restore
      - name: Retain verified restore report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-machine-restore-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/clean-machine-restore/CLEAN-RESTORE.json
            work/clean-machine-restore/MANIFEST.json
          if-no-files-found: error
          retention-days: 30
