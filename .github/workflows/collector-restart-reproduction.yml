name: Archive collector restart reproduction

on:
  push:
    branches: [drill/archive-collector-restart-20261113]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install headless VM tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Observe an owned collector restart in the disposable guest
        run: |
          mkdir -p work
          python3 -I -S -B scripts/network_monitor_archive_vm.py --output work/archive-restart-drill --reproduce-collector-restart
      - name: Retain verified diagnostic evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-collector-restart-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/archive-restart-drill/COLLECTOR-RESTART.json
            work/archive-restart-drill/MANIFEST.json
          if-no-files-found: error
          retention-days: 30
